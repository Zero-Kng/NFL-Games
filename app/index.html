<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NFL Games — Treinador · Olheiro · Comentarista</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<!-- Fontes sem bloquear a primeira pintura: a página desenha com a fonte do
     sistema e troca quando (e se) o Google Fonts responder. -->
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" /></noscript>
<link rel="stylesheet" href="css/app.css" />
</head>
<body>
<div class="app">

  <!-- ============ HEADER ============ -->
  <div class="topbar">
    <button class="back-btn" id="backBtn" style="display:none" aria-label="Voltar">‹</button>
    <div class="shield">NFL</div>
    <div>
      <div class="title" id="hdrTitle">NFL GAMES</div>
      <div class="sub" id="hdrSub">Carregando dataset...</div>
    </div>
    <div class="spacer"></div>
    <button class="icon-btn" id="btnInfo" aria-label="Sobre os dados">ℹ️</button>
  </div>

  <!-- ============ HOME ============ -->
  <section class="screen active" id="home">
    <div class="weeks" id="weekChips" role="tablist" aria-label="Semanas da temporada"></div>

    <div class="persona-wrap">
      <div class="persona-lead" id="personaLead">Escolha seu modo</div>
      <div class="personas">
        <button class="persona coach" data-go="coach">
          <div class="emoji">🎯</div>
          <h3>TREINADOR</h3>
          <p>Prancheta com o tracking real das jogadas</p>
        </button>
        <button class="persona scout" data-go="scout">
          <div class="emoji">🔍</div>
          <h3>OLHEIRO</h3>
          <p>Ratings e atributos por percentil</p>
        </button>
        <button class="persona commentator" data-go="commentator">
          <div class="emoji">🎙️</div>
          <div>
            <h3>COMENTARISTA</h3>
            <p>Replay jogada a jogada com placar e narração</p>
          </div>
        </button>
      </div>
    </div>

    <div class="sec-title">Partidas <span class="sec-sub" id="gamesCount"></span></div>
    <div id="gamesList"></div>

    <div class="sec-title">Sugestões de tática <span class="mini-emoji">🎯</span></div>
    <div id="insightsList"></div>

    <div class="sec-title">Jogadores a observar <span class="mini-emoji">🔍</span></div>
    <div id="watchList"></div>

    <div class="sec-title">Bastidores do jogo <span class="mini-emoji">🎬</span></div>
    <div id="notesList"></div>

    <div class="disclaimer" id="datasetNote"></div>
  </section>

  <!-- ============ COACH ============ -->
  <section class="screen" id="coach">
    <div class="persona-head coach">
      <span class="ph-emoji">🎯</span>
      <div>
        <div class="ph-title">MODO TREINADOR</div>
        <div class="ph-sub" id="coachSub">—</div>
      </div>
    </div>
    <div class="subtabs" id="coachTabs" role="tablist">
      <button class="subtab active" data-tab="lineup">Escalação</button>
      <button class="subtab" data-tab="plays">Jogadas</button>
      <button class="subtab" data-tab="stats">Estatísticas</button>
      <button class="subtab" data-tab="book">Playbook</button>
    </div>
    <div id="coachBody"></div>
  </section>

  <!-- ============ SCOUT ============ -->
  <section class="screen" id="scout">
    <div class="persona-head scout">
      <span class="ph-emoji">🔍</span>
      <div>
        <div class="ph-title">MODO OLHEIRO</div>
        <div class="ph-sub">Avaliação a partir de PFF + tracking</div>
      </div>
    </div>
    <div class="search">🔎 <input id="scoutSearch" placeholder="Buscar jogador..." aria-label="Buscar jogador" /></div>
    <div class="filters" id="scoutFilters"></div>
    <div id="scoutBody"></div>
  </section>

  <!-- ============ COMMENTATOR ============ -->
  <section class="screen" id="commentator">
    <div class="persona-head commentator">
      <span class="ph-emoji">🎙️</span>
      <div>
        <div class="ph-title">MODO COMENTARISTA</div>
        <div class="ph-sub" id="bcSub">—</div>
      </div>
      <div class="spacer"></div>
      <div class="live-mini"><span class="dot"></span>REPLAY</div>
    </div>
    <div id="bcBody"></div>
  </section>

  <!-- ============ BOTTOM NAV ============ -->
  <nav class="bottom-nav">
    <button class="nav-item active" data-go="home"><span class="ic">🏈</span>Jogos</button>
    <button class="nav-item" data-go="coach"><span class="ic">🎯</span>Treinador</button>
    <button class="nav-item" data-go="scout"><span class="ic">📊</span>Olheiro</button>
    <button class="nav-item" data-go="commentator"><span class="ic">🎙️</span>Narração</button>
  </nav>
</div>

<script src="js/app.js"></script>
</body>
</html>
